# =============================================================================
# EMPCL ERP — Production Docker Compose
# File: docker-compose.production.yml
# Usage on server:
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
# =============================================================================
name: empcl-erp

services:

  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: empcl-erp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./erp-backend
      dockerfile: Dockerfile
    container_name: empcl-erp-backend
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@empcl-erp-postgres:5432/${POSTGRES_DB}
      DB_HOST: empcl-erp-postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "4000:4000"
    volumes:
      - ./erp-backend/uploads:/app/uploads
      - ./erp-backend/backups:/app/backups
      - ./erp-backend/src/config:/app/src/config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-network
    # Increased tolerances: backend may take time to warm up or recover
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    # Prevent log files filling disk
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Memory limit to prevent OOM kills on small droplets
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ─── Frontend (Vite → Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile
    container_name: empcl-erp-frontend
    # 'always' ensures the container restarts after OOM kills, reboots, or crashes
    restart: always
    ports:
      - "9000:9000"
    # Use service_started instead of service_healthy:
    # This means frontend starts once backend container is RUNNING,
    # not after it passes health checks. This prevents frontend from being
    # killed/stopped if backend has a temporary health blip.
    depends_on:
      backend:
        condition: service_started
    networks:
      - erp-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Prevent nginx logs filling disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Nginx is very lightweight — 128M is more than enough
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

