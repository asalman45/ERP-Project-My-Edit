name: empcl-erp

services:
  # ─── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./erp-backend
      dockerfile: Dockerfile
    container_name: empcl-erp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # ── DB settings — assumes Postgres is already running externally ──────
      # Update the host/port/user/pass/name below to match your existing DB.
      DATABASE_URL: postgresql://empcl_user:empcl_pass123@empcl-erp-postgres:5432/erp_db
      DB_HOST: empcl-erp-postgres
      DB_PORT: 5432
      DB_USER: empcl_user
      DB_PASSWORD: empcl_pass123
      DB_NAME: erp_db
      # Puppeteer / Chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "4000:4000"
    volumes:
      - ./erp-backend/uploads:/app/uploads
      - ./erp-backend/backups:/app/backups
    networks:
      - erp-network
      # Attach to the network where your existing Postgres lives
      - empclerp_empcl-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Frontend (Vite → Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile
    container_name: empcl-erp-frontend
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - erp-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  # Internal network for frontend ↔ backend communication
  erp-network:
    driver: bridge

  # External network where your existing Postgres container lives
  # If your Postgres is on a different network name, update this accordingly.
  empclerp_empcl-network:
    external: true
