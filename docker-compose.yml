
services:
  # ─── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./erp-backend
      dockerfile: Dockerfile
    container_name: empcl-erp-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://empcl_user:EmPcL2026SecureERP@empcl-erp-postgres:5432/erp_db
      DB_HOST: empcl-erp-postgres
      DB_PORT: 5432
      DB_USER: empcl_user
      DB_PASSWORD: EmPcL2026SecureERP
      DB_NAME: erp_db
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "4000:4000"
    volumes:
      - ./erp-backend/uploads:/app/uploads
      - ./erp-backend/backups:/app/backups
    networks:
      - erp-network
      - empclerp_empcl-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Frontend (Vite → Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./erp-frontend
      dockerfile: Dockerfile
    container_name: empcl-erp-frontend
    restart: always
    ports:
      - "9000:9000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - erp-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Postgres Database ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: empcl-erp-postgres
    restart: always
    environment:
      POSTGRES_USER: empcl_user
      POSTGRES_PASSWORD: EmPcL2026SecureERP
      POSTGRES_DB: erp_db
    ports:
      - "5432:5432"
    volumes:
      - empcl-erp_postgres_data:/var/lib/postgresql/data
    networks:
      - erp-network
      - empclerp_empcl-network

networks:
  erp-network:
    driver: bridge
  empclerp_empcl-network:
    external: true

volumes:
  empcl-erp_postgres_data:
    external: true
